aid: babylist
name: BabyList
description: >-
  Babylist is the leading universal baby registry and a baby-focused commerce and
  content company for growing families. Because the registry is universal, parents
  can add any product from any store — including Amazon, Target, and Etsy — to a
  single list. Babylist has grown into a full ecosystem spanning the Babylist
  registry, the Babylist Shop, Babylist Health (insurance-covered breast pumps),
  Babylist Money (family financial planning), expert product guides, and a flagship
  Los Angeles showroom. More than 10 million people shop with Babylist every year.
  Surfaced as a portfolio company of 500-global and norwest-venture-partners and
  added to the API Evangelist network; Babylist runs no public developer API, but
  it does publish an llms.txt agent surface and an OpenID Connect discovery document.
